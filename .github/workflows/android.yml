name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK package and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | sed -n '1,8p'
          mkdir -p dist
          cp "$APK" dist/Music-Light-v0.4.0-debug.apk
          ls -lh dist/Music-Light-v0.4.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-Light-v0.4.0-debug
          path: dist/Music-Light-v0.4.0-debug.apk
          if-no-files-found: error
