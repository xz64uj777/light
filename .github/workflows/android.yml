name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build clean release APK
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Align, sign, and verify installable APK
        env:
          KEYSTORE_PASSWORD: musiclight-ci-password
          KEY_PASSWORD: musiclight-ci-password
        run: |
          set -euxo pipefail
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=app-release-aligned.apk
          APK=Music-Light-Pandora-v1.1.0.apk

          test -s "$UNSIGNED"
          "$SDK_BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          keytool -genkeypair -v             -keystore music-light-ci.jks             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -alias musiclight             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Music Light CI, OU=Android, O=Music Light, L=Build, ST=Build, C=US"

          "$SDK_BUILD_TOOLS/apksigner" sign             --ks music-light-ci.jks             --ks-pass pass:"$KEYSTORE_PASSWORD"             --key-pass pass:"$KEY_PASSWORD"             --out "$APK"             "$ALIGNED"

          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$SDK_BUILD_TOOLS/aapt2" dump badging "$APK" | sed -n '1,10p'
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-Light-Pandora-v1.1.0-installable
          path: Music-Light-Pandora-v1.1.0.apk
          if-no-files-found: error
